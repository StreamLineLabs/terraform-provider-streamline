version: "2"

run:
  go: "1.25"

linters:
  enable:
    - gocritic
    - gosec
    - misspell
    - nilerr
    - unconvert
    - unparam
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (*github.com/hashicorp/terraform-plugin-framework/resource.SchemaResponse).Diagnostics.Append
        - (*github.com/hashicorp/terraform-plugin-framework/datasource.SchemaResponse).Diagnostics.Append
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        # Terraform Plugin Framework method signatures (Configure/Create/Read/
        # Update/Delete and friends) are fixed by the resource/datasource
        # interfaces: their request structs must be passed by value. Taking a
        # pointer instead would no longer satisfy the interfaces, so hugeParam
        # is not actionable here and is disabled globally for consistency with
        # the helpers that mirror those signatures.
        - hugeParam
    gosec:
      excludes:
        - G104
    govet:
      enable-all: true
      disable:
        - fieldalignment
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - gosec
      - path: internal/provider/
        linters:
          - unparam
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
